<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws://127.0.0.1:5178; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>战双助手</title>
    <style>
      body { margin: 0; }
      #startup-status {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: #f5f5f7;
        color: #27272a;
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      #startup-status h1 { margin: 0; font-size: 20px; }
      #startup-status p { margin: 0; color: #71717a; font-size: 14px; }
      #startup-status button {
        padding: 9px 18px;
        border: 0;
        border-radius: 7px;
        background: #f97316;
        color: white;
        font: inherit;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="startup-status" role="status">
        <h1>正在打开战双助手</h1>
        <p>正在加载界面，请稍候。</p>
      </main>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
